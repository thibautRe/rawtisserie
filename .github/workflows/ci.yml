name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (with golden images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache golden RAWs
        uses: actions/cache@v4
        with:
          path: crates/pipeline/tests/golden/raws
          key: golden-raws-${{ hashFiles('crates/pipeline/tests/golden/raws.txt') }}
      - run: ./scripts/fetch-golden-raws.sh
      - run: cargo test --workspace --locked
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/tmp/golden/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: TypeScript (wasm build, typecheck, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present
