name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (with golden images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache golden RAWs
        uses: actions/cache@v6
        with:
          path: crates/pipeline/tests/golden/raws
          key: golden-raws-${{ hashFiles('crates/pipeline/tests/golden/raws.txt') }}
      - run: ./scripts/fetch-golden-raws.sh
      - run: cargo test --workspace --locked
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: target/tmp/golden/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: TypeScript (wasm build, typecheck, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rawtisserie:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file
        run: docker compose -f deploy/compose.yaml config --quiet
        env:
          DOMAIN: rawtisserie.example.com
          POSTGRES_PASSWORD: ci
      - name: Caddyfile
        run: >-
          docker run --rm -e DOMAIN=rawtisserie.example.com
          -v ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro docker.io/library/caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Backup image
        run: shellcheck deploy/backup/backup.sh && docker build deploy/backup
