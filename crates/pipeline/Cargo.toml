[package]
name = "rawtisserie-pipeline"
description = "RAWtisserie pixel pipeline: RAW decoding, development and encoding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rawler.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jpeg-encoder.workspace = true
flate2 = "1"
png = "0.18"
sha2 = "0.10"
# Images that aren't RAW files (`bitmap`): pure Rust, so they build for wasm too.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
moxcms = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
