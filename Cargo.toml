[workspace]
resolver = "3"
members = ["crates/pipeline", "crates/pipeline-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
rawtisserie-pipeline = { path = "crates/pipeline" }
rawler = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jpeg-encoder = "0.7"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"
panic = "abort"

# Pixel loops are unbearably slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1

# rawler 0.8.0 with one fix: its CR3 (CRX) decoder timed itself with
# std::time::Instant::now() for a debug log, which panics in wasm32-unknown-unknown; the
# timing is now compiled only on targets with a clock. Tag rawtisserie/rawler-0.8.0-wasm of
# our fork, on the commit 0.8.0 was published from. Upstream PR: dnglab/dnglab#960, merged
# (0bf0fd9) but not released; drop this once a release has it (see ROADMAP, Cross-cutting:
# upstream's master changes the decoding API).
[patch.crates-io]
rawler = { git = "https://github.com/thibautRe/dnglab", rev = "b653ac0c9598242bc72b5121dacbda848ce989f0" }
