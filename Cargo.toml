[workspace]
resolver = "3"
members = ["crates/pipeline", "crates/pipeline-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rawtisserie-pipeline = { path = "crates/pipeline" }
rawler = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jpeg-encoder = "0.7"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"
panic = "abort"

# Pixel loops are unbearably slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
