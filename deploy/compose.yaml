# Production on a single machine: Caddy (HTTPS) → the server, Postgres, and nightly
# database backups. See docs/DEPLOYMENT.md.
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    image: ${RAWTISSERIE_IMAGE:-ghcr.io/thibautre/rawtisserie:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rawtisserie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rawtisserie
      COOKIE_SECURE: 'true'
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rawtisserie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rawtisserie
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rawtisserie']
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    build: ./backup
    image: rawtisserie-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: rawtisserie
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rawtisserie
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-OVHcloud}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:z
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  app-data:
  db-data:
